[project]
name = "md-style"
version = "2.0.0"
description = "Professional Markdown-to-HTML & PDF Report Generator for Pandoc"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "babel>=2.14.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
md-to-report = "core.cli:main"
md-style = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
