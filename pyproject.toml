[project]
name = "md-style"
version = "3.0.0"
description = "Pure-Python Professional Markdown-to-HTML & PDF Report Generator with Knowledge Packs & Svelte Viewer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "babel>=2.14.0",
    "pyyaml>=6.0.3",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "pygments>=2.17.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.5",
    "linkify-it-py>=2.0.3",
]

[project.scripts]
md-to-report = "core.cli:main"
md-style = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "playwright>=1.40.0",
    "pytest-playwright>=0.5.0",
]

