<!-- forensic-interactive.html: Zero-dependency screen enhancements for Digital Forensic Reports -->
<div id="forensic-progress-bar" aria-hidden="true"></div>
<div id="forensic-sticky-bar" aria-hidden="true">
  <div class="sticky-bar-inner">
    <span class="sticky-bar-tag"></span>
    <span class="sticky-bar-title" id="forensic-sticky-title"></span>
  </div>
</div>

<script>
(function() {
  'use strict';

  var escapeHtml = function(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, function(s) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
    });
  };

  // 1. Reading Progress Bar
  var progressBar = document.getElementById('forensic-progress-bar');
  if (progressBar) {
    var updateProgress = function() {
      var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      var scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      progressBar.style.width = scrolled + '%';
    };
    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress, { passive: true });
    updateProgress();
  }

  // 2. Click-to-Copy Affordance on Hashes, IoCs & Code
  var copyableTargets = document.querySelectorAll('code.hash, .hash, .ioc, .copyable, td code, code.mitre-pill');
  
  copyableTargets.forEach(function(el) {
    if (el.closest('pre')) return;

    el.setAttribute('title', 'Click to copy');
    el.classList.add('can-copy');

    el.addEventListener('click', function(e) {
      var selection = window.getSelection().toString();
      if (selection && selection.length > 0) return;

      var textToCopy = el.getAttribute('data-copy') || el.innerText.trim();
      if (!textToCopy) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(function() {
          showCopyFeedback(el);
        }).catch(function() {
          fallbackCopy(textToCopy, el);
        });
      } else {
        fallbackCopy(textToCopy, el);
      }
    });
  });

  function fallbackCopy(text, el) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      showCopyFeedback(el);
    } catch (err) {}
    document.body.removeChild(textarea);
  }

  function showCopyFeedback(el) {
    el.classList.add('copied');
    var originalTitle = el.getAttribute('title');
    el.setAttribute('title', 'Copied to clipboard!');

    setTimeout(function() {
      el.classList.remove('copied');
      if (originalTitle) el.setAttribute('title', originalTitle);
    }, 1500);
  }

  // 3. Top Sticky Dossier Ribbon (Active Section Tracker)
  var stickyBar = document.getElementById('forensic-sticky-bar');
  var stickyTitle = document.getElementById('forensic-sticky-title');

  if (stickyBar && stickyTitle) {
    var docLang = (document.documentElement.lang || document.body.lang || 'en').toLowerCase();
    var isCzech = docLang.indexOf('cs') === 0 || docLang.indexOf('sk') === 0 || docLang.indexOf('cz') === 0;
    stickyBar.setAttribute('title', isCzech ? 'Kliknutím přejdete na začátek sekce' : 'Click to scroll to active section');

    var headings = Array.from(document.querySelectorAll('body > h2, body > h3, main h2, main h3, section h2, section h3'));
    
    headings = headings.filter(function(h) {
      return !h.closest('#TOC') && !h.closest('#title-block-header') && h.id !== 'toc-title';
    });

    var activeHeading = null;

    var updateActiveSection = function() {
      var scrollY = window.pageYOffset || document.documentElement.scrollTop;
      
      if (headings.length === 0 || scrollY < 140) {
        stickyBar.classList.remove('visible');
        activeHeading = null;
        return;
      }

      var current = null;
      var threshold = 95;

      for (var i = 0; i < headings.length; i++) {
        var h = headings[i];
        var top = h.getBoundingClientRect().top;
        if (top <= threshold) {
          current = h;
        } else {
          break;
        }
      }

      if (current) {
        if (current !== activeHeading) {
          activeHeading = current;
          var titleText = current.innerText.trim();
          
          if (current.tagName.toLowerCase() === 'h3') {
            var prevH2 = null;
            for (var j = headings.indexOf(current) - 1; j >= 0; j--) {
              if (headings[j].tagName.toLowerCase() === 'h2') {
                prevH2 = headings[j];
                break;
              }
            }
            if (prevH2) {
              var parentText = prevH2.innerText.trim();
              stickyTitle.innerHTML = '<span class="sticky-parent">' + escapeHtml(parentText) + '</span>' +
                                      '<span class="sticky-sep">›</span>' +
                                      '<span class="sticky-current">' + escapeHtml(titleText) + '</span>';
            } else {
              stickyTitle.textContent = titleText;
            }
          } else {
            stickyTitle.textContent = titleText;
          }
        }
        stickyBar.classList.add('visible');
      } else {
        stickyBar.classList.remove('visible');
        activeHeading = null;
      }
    };

    window.addEventListener('scroll', updateActiveSection, { passive: true });
    window.addEventListener('resize', updateActiveSection, { passive: true });
    updateActiveSection();

    stickyBar.addEventListener('click', function() {
      if (activeHeading) {
        activeHeading.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }

  // 4. Client Mermaid Fallback (only triggered if unsupported schemas exist)
  var fallbackDiagrams = document.querySelectorAll('.mermaid-fallback pre.mermaid');
  if (fallbackDiagrams.length > 0) {
    import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs')
      .then(function(mermaid) {
        mermaid.default.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
        fallbackDiagrams.forEach(function(el, idx) {
          var id = 'mermaid-fallback-' + idx;
          var code = el.textContent;
          mermaid.default.render(id, code).then(function(result) {
            var wrapper = el.parentElement;
            if (wrapper) wrapper.innerHTML = result.svg;
          }).catch(function(err) {
            console.warn('[Mermaid Fallback] Failed to render:', err);
          });
        });
      })
      .catch(function(err) {
        console.warn('[Mermaid Fallback] Could not load mermaid runtime:', err);
      });
  }

  // 5. Interactive Table & Timeline Filter Bar (Adaptive Pills / Dropdown + Search)
  var docLang = (document.documentElement.lang || document.body.getAttribute('lang') || 'en').toLowerCase();
  var isCzech = docLang.startsWith('cs') || docLang.startsWith('cz');
  var isSlovak = docLang.startsWith('sk');
  var isGerman = docLang.startsWith('de');

  var i18nFilter = {
    placeholder: isCzech ? 'Filtrovat záznamy (např. IP, uživatel, proces)...' :
                 isSlovak ? 'Filtrovať záznamy (napr. IP, používateľ, proces)...' :
                 isGerman ? 'Einträge filtern (z.B. IP, Benutzer)...' :
                 'Filter records (e.g. IP, user, command)...',
    allLabel: isCzech ? 'Vše' : isSlovak ? 'Všetko' : isGerman ? 'Alle' : 'All',
    allDropdown: isCzech ? 'Všechny kategorie' : isSlovak ? 'Všetky kategórie' : isGerman ? 'Alle Kategorien' : 'All categories',
    categoryPrefix: isCzech ? 'Fáze:' : isSlovak ? 'Fáza:' : isGerman ? 'Kategorie:' : 'Category:',
    showing: function(shown, total) {
      if (isCzech) return 'Zobrazeno ' + shown + ' z ' + total;
      if (isSlovak) return 'Zobrazené ' + shown + ' z ' + total;
      if (isGerman) return 'Angezeigt: ' + shown + ' von ' + total;
      return 'Showing ' + shown + ' of ' + total;
    },
    noMatch: isCzech ? 'Nenalezen žádný záznam' :
             isSlovak ? 'Nenájdený žiadny záznam' :
             isGerman ? 'Keine Einträge gefunden' :
             'No matching records'
  };

  var tables = document.querySelectorAll('table');
  tables.forEach(function(table, tableIdx) {
    var tbody = table.querySelector('tbody');
    if (!tbody) return;
    var rows = Array.from(tbody.querySelectorAll('tr'));
    var isTimeline = table.classList.contains('table-timeline');
    if (rows.length < 4 && !isTimeline) return;

    // Auto-discover the best categorical column across table headers
    var numCols = rows[0].children.length;
    var bestColIdx = -1;
    var bestCatCounts = null;
    var bestUniqueCats = [];
    var fallbackColIdx = -1;
    var fallbackCatCounts = null;

    // Check columns from left to right (preferring column 2 for timelines)
    var scanOrder = isTimeline ? [1] : [];
    for (var c = 0; c < numCols; c++) {
      if (scanOrder.indexOf(c) === -1) scanOrder.push(c);
    }

    for (var i = 0; i < scanOrder.length; i++) {
      var col = scanOrder[i];
      var counts = {};
      var isValid = true;
      for (var r = 0; r < rows.length; r++) {
        var cell = rows[r].children[col];
        if (!cell) { isValid = false; break; }
        var val = cell.textContent.trim().replace(/\s+/g, ' ');
        if (val.length === 0 || val.length > 35) { isValid = false; break; }
        counts[val] = (counts[val] || 0) + 1;
      }
      if (!isValid) continue;

      var uCats = Object.keys(counts);
      // Ideal for pills: 2 to 5 distinct categories where values recur
      if (uCats.length >= 2 && uCats.length <= 5 && uCats.length < rows.length) {
        bestColIdx = col;
        bestCatCounts = counts;
        bestUniqueCats = uCats;
        break;
      } else if (uCats.length > 5 && uCats.length <= Math.min(rows.length, 30) && fallbackColIdx === -1) {
        fallbackColIdx = col;
        fallbackCatCounts = counts;
      }
    }

    var catColIdx = bestColIdx !== -1 ? bestColIdx : fallbackColIdx;
    var catCounts = bestColIdx !== -1 ? bestCatCounts : (fallbackCatCounts || {});
    var uniqueCats = Object.keys(catCounts);

    var renderPills = bestColIdx !== -1 && uniqueCats.length >= 2 && uniqueCats.length <= 5;
    var renderDropdown = !renderPills && fallbackColIdx !== -1 && uniqueCats.length > 5;

    // Discover column label from header th
    var colHeaderEl = catColIdx !== -1 ? table.querySelector('thead tr th:nth-child(' + (catColIdx + 1) + ')') : null;
    var colHeaderTitle = colHeaderEl ? colHeaderEl.textContent.trim() : '';
    var categoryLabel = colHeaderTitle ? colHeaderTitle + ':' : i18nFilter.categoryPrefix;

    // Build Toolbar DOM
    var toolbar = document.createElement('div');
    toolbar.className = 'table-filter-toolbar';
    toolbar.setAttribute('data-table-idx', tableIdx);

    var mainRow = document.createElement('div');
    mainRow.className = 'table-filter-main';

    var searchWrap = document.createElement('div');
    searchWrap.className = 'table-filter-search-wrap';

    var icon = document.createElement('span');
    icon.className = 'table-filter-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '⌕';

    var input = document.createElement('input');
    input.type = 'search';
    input.className = 'table-filter-input';
    input.placeholder = i18nFilter.placeholder;
    input.setAttribute('aria-label', i18nFilter.placeholder);

    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'table-filter-clear';
    clearBtn.setAttribute('aria-label', 'Clear filter');
    clearBtn.title = 'Clear filter (Esc)';
    clearBtn.textContent = '×';
    clearBtn.style.display = 'none';

    searchWrap.appendChild(icon);
    searchWrap.appendChild(input);
    searchWrap.appendChild(clearBtn);
    mainRow.appendChild(searchWrap);

    var selectDropdown = null;
    if (renderDropdown) {
      selectDropdown = document.createElement('select');
      selectDropdown.className = 'table-filter-select';
      selectDropdown.setAttribute('aria-label', colHeaderTitle || i18nFilter.allDropdown);

      var optAll = document.createElement('option');
      optAll.value = '';
      optAll.textContent = (colHeaderTitle ? colHeaderTitle + ': ' : '') + i18nFilter.allDropdown + ' (' + rows.length + ')';
      selectDropdown.appendChild(optAll);

      uniqueCats.forEach(function(cat) {
        var opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat + ' (' + catCounts[cat] + ')';
        selectDropdown.appendChild(opt);
      });

      mainRow.appendChild(selectDropdown);
    }

    var counter = document.createElement('span');
    counter.className = 'table-filter-counter';
    counter.textContent = i18nFilter.showing(rows.length, rows.length);
    mainRow.appendChild(counter);

    toolbar.appendChild(mainRow);

    var pillBtns = [];
    if (renderPills) {
      var pillsRow = document.createElement('div');
      pillsRow.className = 'table-filter-pills';

      var pillsLabel = document.createElement('span');
      pillsLabel.className = 'table-filter-pills-label';
      pillsLabel.textContent = categoryLabel;
      pillsRow.appendChild(pillsLabel);

      var pillAll = document.createElement('button');
      pillAll.type = 'button';
      pillAll.className = 'filter-pill is-active';
      pillAll.setAttribute('data-category', '');
      pillAll.innerHTML = i18nFilter.allLabel + ' <span class="pill-count">' + rows.length + '</span>';
      pillsRow.appendChild(pillAll);
      pillBtns.push(pillAll);

      uniqueCats.forEach(function(cat) {
        var pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'filter-pill';
        pill.setAttribute('data-category', cat);
        pill.innerHTML = escapeHtml(cat) + ' <span class="pill-count">' + catCounts[cat] + '</span>';
        pillsRow.appendChild(pill);
        pillBtns.push(pill);
      });

      toolbar.appendChild(pillsRow);
    }

    // Insert toolbar immediately above outermost table-wrapper (or table)
    var mountTarget = table;
    while (mountTarget.parentElement && mountTarget.parentElement.classList.contains('table-wrapper')) {
      mountTarget = mountTarget.parentElement;
    }
    mountTarget.parentElement.insertBefore(toolbar, mountTarget);

    // Filter Logic
    var activeCategory = '';
    var searchQuery = '';

    function updateTimelineRails() {
      if (!isTimeline) return;
      var visible = rows.filter(function(r) { return !r.classList.contains('table-row-hidden'); });
      rows.forEach(function(r) {
        r.classList.remove('is-first-visible', 'is-last-visible');
      });
      if (visible.length > 0) {
        visible[0].classList.add('is-first-visible');
        visible[visible.length - 1].classList.add('is-last-visible');
      }
    }

    function applyFilter() {
      var visibleCount = 0;
      rows.forEach(function(row) {
        var textMatch = (searchQuery === '') || (row.textContent.toLowerCase().indexOf(searchQuery) !== -1);
        var catMatch = (activeCategory === '');
        if (!catMatch && catColIdx !== -1 && row.children[catColIdx]) {
          var rowCat = row.children[catColIdx].textContent.trim().replace(/\s+/g, ' ');
          catMatch = (rowCat === activeCategory);
        }

        if (textMatch && catMatch) {
          row.classList.remove('table-row-hidden');
          visibleCount++;
        } else {
          row.classList.add('table-row-hidden');
        }
      });

      if (visibleCount === 0) {
        counter.textContent = i18nFilter.noMatch;
        counter.classList.add('is-empty');
      } else {
        counter.textContent = i18nFilter.showing(visibleCount, rows.length);
        counter.classList.remove('is-empty');
      }

      clearBtn.style.display = (searchQuery !== '' || activeCategory !== '') ? 'inline-block' : 'none';
      updateTimelineRails();
    }

    input.addEventListener('input', function() {
      searchQuery = this.value.trim().toLowerCase();
      applyFilter();
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        input.value = '';
        searchQuery = '';
        applyFilter();
      }
    });

    clearBtn.addEventListener('click', function() {
      input.value = '';
      searchQuery = '';
      activeCategory = '';
      if (selectDropdown) selectDropdown.value = '';
      pillBtns.forEach(function(p) {
        if (p.getAttribute('data-category') === '') p.classList.add('is-active');
        else p.classList.remove('is-active');
      });
      input.focus();
      applyFilter();
    });

    if (selectDropdown) {
      selectDropdown.addEventListener('change', function() {
        activeCategory = this.value;
        applyFilter();
      });
    }

    pillBtns.forEach(function(pill) {
      pill.addEventListener('click', function() {
        var targetCat = this.getAttribute('data-category');
        if (activeCategory === targetCat && targetCat !== '') {
          // Toggle off back to all
          activeCategory = '';
        } else {
          activeCategory = targetCat;
        }

        pillBtns.forEach(function(p) {
          if (p.getAttribute('data-category') === activeCategory) {
            p.classList.add('is-active');
          } else {
            p.classList.remove('is-active');
          }
        });

        applyFilter();
      });
    });
  });
})();
</script>
